<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Areas | Federal Hot Water Solutions</title>
    <meta name="description" content="Federal Hot Water Solutions proudly serves Easton, Bethlehem, Allentown, Nazareth, Bath, Wind Gap and surrounding communities in the Lehigh Valley.">

    <style>
        :root {
            --navy: #1D2B44;
            --accent: #0077B6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f9fa;
            color: var(--navy);
        }
        .home-btn {
            display: inline-block;
            background: var(--navy);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background: #152033;
        }
        .page-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 22px 20px;
            text-align: center;
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 700;
        }

        .page-header p {
            margin: 8px 0 0;
            color: #555;
            font-size: 1rem;
        }

        .map-layout {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 30px;
            max-width: 1450px;
            margin: 40px auto;
            padding: 0 20px;
            align-items: start;
        }

        .map-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            padding: 25px;
            text-align: center;
        }

        .map-panel h2 {
            margin: 0 0 18px;
            font-size: 1.2rem;
        }

        .map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .map-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        .map-container svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .county-shape {
            fill: transparent;
            stroke: transparent;
            stroke-width: 2;
            cursor: pointer;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .county-shape:hover {
            fill: rgba(0, 119, 182, 0.2);
            stroke: var(--accent);
        }

        .iframe-panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .iframe-panel h2 {
            margin: 0 0 12px;
            font-size: 1.2rem;
        }

        .iframe-panel iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666;
        }

        @media (max-width: 800px) {
            .map-layout {
                grid-template-columns: 1fr;
            }

            .iframe-panel iframe {
                height: 500px;
            }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <a href="home.html" class="home-btn">← Home</a>
</div>
    <div class="page-header">
        <h1>Service Areas</h1>
        <p>Proudly serving the Lehigh Valley and surrounding communities</p>
    </div>

    <div class="map-layout">

        <div class="map-panel">
            <h2>Pennsylvania Map</h2>
            
            <div class="map-container">
                <img src="map2.jpeg" alt="Pennsylvania Counties Map">
                
                <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
                    <a href="monroecounty.html" target="countyFrame" title="Monroe County">
                        <polygon class="county-shape" points="432,124 405,144 362,178 396,220 442,290 467,308 620,298 638,290 642,250 706,218 672,236 625,188 621,125 595,138 516,142" />
                    </a>

                    <a href="carboncounty.html" target="countyFrame" title="Carbon County">
                        <polygon class="county-shape" points="308,334 360,285 283,198 318,168 370,200 442,290 396,384 237,428" />
                    </a>

                    <a href="lehighcounty.html" target="countyFrame" title="Lehigh County">
                        <polygon class="county-shape" points="232,468 237,428 396,384 420,402 390,428 432,465 502,534 458,576" />
                    </a>

                    <a href="northamptoncounty.html" target="countyFrame" title="Northampton County">
                        <polygon class="county-shape" points="467,350 442,390 396,384 420,402 390,428 432,465 502,534 560,520 592,512 590,452 595,400 615,376 668,360 660,315 612,300 620,320" />
                    </a>

                    <a href="buckscounty.html" target="countyFrame" title="Bucks County">
                        <polygon class="county-shape" points="458,576 502,534 560,520 592,512 655,518 666,568 725,612 728,660 848,745 723,808 574,674" />
                    </a>
                </svg>
            </div>

            <p class="hint">Click a county to view it on the right →</p>
        </div>

        <div class="iframe-panel">
            <h2>County Information</h2>
            <iframe name="countyFrame" src="about:blank" title="County details"></iframe>
        </div>

    </div>

</body>
</html>
